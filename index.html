<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>COMPREXO</title>
  <link rel="icon" href="https://i.postimg.cc/76MD5Vcz/COMPREXO-RDR-BLACK4x.webp" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a0a0a;   /* 🖤 PRETO PURO */
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 40px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .logo .dot {
      font-size: 1.2rem;
      color: #e63946;   /* 🔴 Vermelho */
      animation: blink 1.5s infinite;   /* ✨ Piscando */
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    nav {
      background: #141414;   /* 🖤 Card escuro */
      border: 1px solid #2a2a2a;   /* Borda sutil */
      padding: 18px 30px;
      border-radius: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
      margin: 35px 0;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    nav a {
      color: #b0b0b0;   /* Cinza */
      text-decoration: none;
      transition: all 0.3s ease;
      padding: 8px 16px;
      border-radius: 8px;
    }
    nav a:hover {
      color: #e63946;   /* 🔴 Vermelho no hover */
      background: rgba(230, 57, 70, 0.1);
    }
    .message {
      font-size: 1.1rem;
      max-width: 600px;
      background: #141414;
      border: 1px solid #2a2a2a;
      padding: 30px 35px;
      border-radius: 16px;
      margin: 0 20px 35px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .message p {
      margin: 8px 0;
      font-size: 15px;
      color: #a0a0a0;
      line-height: 1.6;
    }
    .message .author {
      font-size: 13px;
      color: #e63946;
      margin-top: 15px;
      font-weight: 600;
    }
    .image-center {
      width: 280px;
      animation: pulse 2.5s infinite ease-in-out;
      margin: 20px 0 50px;
      filter: drop-shadow(0 0 20px rgba(230, 57, 70, 0.3));   /* 🔴 Sombra vermelha */
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .footer {
      font-size: 0.85em;
      color: #555;
      text-align: center;
      padding: 25px;
      margin-top: auto;
      border-top: 1px solid #1a1a1a;   /* Linha separadora */
      width: 100%;
    }
    .footer p {
      margin: 6px 0;
    }
    .footer a {
      color: #777;
      text-decoration: none;
      transition: color 0.3s;
    }
    .footer a:hover {
      color: #e63946;
    }
  </style>
</head>
<body>
  <div class="logo">
    COMPREXO <span class="dot">●</span>
  </div>
  
  <nav>
    <a href="index.html">🏠 Início</a>
    <a href="entrevista/index.html">🎤 Entrevista</a>
    <a href="alinhamento/index.html">🎫 Alinhamento</a>
  </nav>
  
  <div class="message">
    <p>Criei isso pra organizar minha cabeça bagunçada.</p>
    <p>Se te ajudar de algum jeito, a gente já ganhou! 💜</p>
    <p class="author">— Nath</p>
  </div>
  
  <img src="https://i.postimg.cc/9QGqLt5t/COMPREXO-RDR-RED4x.webp" alt="Logo" class="image-center" />
  
  <div class="footer">
    <p>© 2026 - Todos os direitos reservados. Procurar Nath para qualquer ajuste.</p>
    <p>
      Editado por 
      <a href="https://github.com/nsantiago-cpx" target="_blank" style="color:#e63946;">Nath</a>!
    </p>
  </div>
</body>
</html>
