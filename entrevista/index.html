<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>COMPLEXO</title>
  <link rel="icon" href="https://i.postimg.cc/9QGqLt5t/COMPREXO-RDR-RED4x.webp" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .logo {
      font-size: 3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .logo .dot {
      font-size: 1.5rem;
      color: #e63946;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    nav {
      background: #141414;
      border: 1px solid #2a2a2a;
      padding: 15px 25px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 25px 0;
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    nav a {
      color: #b0b0b0;
      text-decoration: none;
      transition: all 0.3s;
      padding: 8px 16px;
      border-radius: 8px;
    }

    nav a:hover {
      color: #e63946;
      background: rgba(230, 57, 70, 0.1);
    }

    .message {
      font-size: 1.3rem;
      max-width: 700px;
      background: #141414;
      border: 1px solid #2a2a2a;
      padding: 25px;
      border-radius: 12px;
      margin: 0 20px 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .message p {
      margin: 5px 0;
      font-size: 14px;
      color: #ccc;
    }

    .message .author {
      font-size: 12px;
      color: #e63946;
      margin-top: 10px;
      font-weight: 600;
    }

    .image-center {
      width: 300px;
      animation: pulse 2s infinite;
      margin: 30px 0 40px;
      filter: drop-shadow(0 0 20px rgba(230, 57, 70, 0.3));
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .footer {
      font-size: 0.9em;
      color: #555;
      text-align: center;
      padding: 20px;
      margin-top: auto;
      border-top: 1px solid #1a1a1a;
      width: 100%;
    }

    .footer img {
      margin-top: 10px;
      width: 120px;
      opacity: 0.8;
    }

    .footer a {
      color: #777;
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer a:hover {
      color: #e63946;
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="logo">
    COMPLEXO GG <span class="dot">●</span>
  </div>

  <nav>
    <a href="index.html">🏠 Início</a>
    <a href="entrevista/index.html">🎤 Entrevista</a>
    <a href="alinhamento/index.html">🎫 Alinhamento</a>
  </nav>

  <div class="message">
    <p>Criei isso pra organizar minha cabeça bagunçada.</p>
    <p>Se te ajudar de algum jeito, a gente já ganhou! 💜</p>
    <p class="author">— Nath</p>
  </div>

  <img src="https://i.postimg.cc/9QGqLt5t/COMPREXO-RDR-RED4x.webp" alt="Logo" class="image-center" />

  <div class="footer">
    <p>© 2026 - Todos os direitos reservados. Procurar Nath para qualquer ajuste.</p>
    <p>
      <a href="https://jackymayers.github.io/" target="_blank" style="color:#777;">Jacky Mayers</a>!
    </p>
    <p>
      Editado por 
      <a href="https://github.com/nsantiago-cpx" target="_blank" style="color:#e63946;">Nath</a>!
    </p>
  </div>
</body>
</html>
